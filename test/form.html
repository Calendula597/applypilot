<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>应聘申请表 · 插件本地测试页</title>
    <style>
      body { font-family: system-ui, 'Microsoft YaHei', sans-serif; background: #f2f4f8; margin: 0; padding: 30px; }
      form { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
      h1 { font-size: 20px; margin: 0 0 20px; }
      h2 { font-size: 15px; margin: 24px 0 12px; padding-left: 8px; border-left: 3px solid #4f7cff; }
      .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 16px; }
      label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555; }
      input, select, textarea { padding: 7px 10px; border: 1px solid #d5d9e0; border-radius: 6px; font-size: 14px; }
      textarea { width: 100%; box-sizing: border-box; }
      .full { grid-column: 1 / -1; }
      .row { border: 1px solid #eceff4; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
      .add { margin-top: 6px; border: 1px dashed #4f7cff; color: #4f7cff; background: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
      .radio-group { display: flex; gap: 16px; align-items: center; padding-top: 6px; }
      .radio-group label { display: flex; gap: 4px; align-items: center; font-size: 14px; color: #333; }
      button[type=submit] { margin-top: 20px; background: #4f7cff; border: none; color: #fff; padding: 10px 28px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <form onsubmit="event.preventDefault(); alert('提交成功（本地测试页不会真的提交）')">
      <h1>应聘申请表（插件本地测试页）</h1>

      <h2>基本信息</h2>
      <div class="grid">
        <label class="f">姓名<input type="text" name="name" /></label>
        <label class="f">手机<input type="tel" name="phone" /></label>
        <label class="f">邮箱<input type="email" name="email" /></label>
        <div class="f">性别
          <div class="radio-group">
            <label><input type="radio" name="gender" value="男" />男</label>
            <label><input type="radio" name="gender" value="女" />女</label>
          </div>
        </div>
        <label class="f">出生日期<input type="date" name="birthday" /></label>
        <label class="f">所在城市<input type="text" name="city" /></label>
        <label class="f">最高学历
          <select name="degree">
            <option value="">请选择</option>
            <option>高中</option>
            <option>大专</option>
            <option>本科</option>
            <option>统招本科</option>
            <option>硕士研究生</option>
            <option>博士研究生</option>
          </select>
        </label>
        <label class="f">工作年限
          <select name="years">
            <option value="">请选择</option>
            <option>应届生</option>
            <option>1-3年</option>
            <option>3-5年</option>
            <option>5-10年</option>
            <option>10年以上</option>
          </select>
        </label>
        <label class="f">应聘职位<input type="text" name="position" /></label>
        <label class="f full">自我介绍<textarea name="intro" rows="3"></textarea></label>
      </div>

      <h2>教育经历</h2>
      <div id="eduRows">
        <div class="row">
          <div class="grid">
            <label class="f">学校<input type="text" name="school" /></label>
            <label class="f">专业<input type="text" name="major" /></label>
            <label class="f">学历
              <select name="edu_degree">
                <option value="">请选择</option>
                <option>大专</option>
                <option>本科</option>
                <option>硕士研究生</option>
                <option>博士研究生</option>
              </select>
            </label>
            <label class="f">入学时间<input type="date" name="edu_start" /></label>
            <label class="f">毕业时间<input type="date" name="edu_end" /></label>
          </div>
        </div>
      </div>
      <button type="button" class="add" onclick="addRow('eduRows')">＋ 添加教育经历</button>

      <h2>工作经历</h2>
      <div id="workRows">
        <div class="row">
          <div class="grid">
            <label class="f">公司名称<input type="text" name="company" /></label>
            <label class="f">职位<input type="text" name="title" /></label>
            <label class="f">入职时间<input type="date" name="work_start" /></label>
            <label class="f">离职时间<input type="date" name="work_end" /></label>
            <label class="f full">工作内容<textarea name="work_desc" rows="2"></textarea></label>
          </div>
        </div>
      </div>
      <button type="button" class="add" onclick="addRow('workRows')">＋ 添加工作经历</button>

      <button type="submit">提交申请</button>
    </form>

    <script>
      function addRow(containerId) {
        const container = document.getElementById(containerId)
        const first = container.querySelector('.row')
        const clone = first.cloneNode(true)
        clone.querySelectorAll('input, textarea').forEach(el => (el.value = ''))
        clone.querySelectorAll('select').forEach(el => (el.selectedIndex = 0))
        clone.querySelectorAll('input[type=radio]').forEach(el => (el.checked = false))
        container.appendChild(clone)
      }
    </script>
  </body>
</html>
